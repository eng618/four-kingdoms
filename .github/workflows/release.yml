name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Secrets cannot be read in step `if:` conditions, but job-level env CAN
    # be populated from secrets — so map them here and gate on env below.
    # Empty/missing secrets become empty strings, which fail the gate safely.
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release jar
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }} --stacktrace

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: build/libs/*.jar
          generate_release_notes: true

      - name: Capture release notes for changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --json body --jq .body > /tmp/release-notes.md
          echo "GITHUB_RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
          cat /tmp/release-notes.md >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Publish to Modrinth / CurseForge
        # Tokens come from job-level env (see above); the step runs if either platform is configured.
        if: ${{ env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew publishMods -Pmod_version=$VERSION --stacktrace
