name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build & test (dev version)
        run: ./gradlew compileJava spotlessCheck check build -Pmod_version=0.0.0-dev+${GITHUB_SHA::7} --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: four-kingdoms-dev-jar
          path: build/libs/*.jar
          retention-days: 14
